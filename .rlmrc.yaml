# RLM Configuration
# Supports multiple profiles with `extends` inheritance

profiles:
  # Local development with Ollama (free, private)
  local:
    provider:
      type: openai
      model: qwen3:latest
      base_url: http://localhost:11434/v1
    budget:
      max_cost: 999.0
      max_iterations: 50
      max_time_seconds: 300

  # Claude Code provider (uses subscription auth, no API key)
  claude-code:
    provider:
      type: claude-code
      model: claude-opus-4-6
    subcall_provider:
      type: claude-code
      model: claude-sonnet-4-6
    budget:
      max_cost: 5.0
      max_iterations: 30
      max_time_seconds: 300

  # Cloud provider with API key
  cloud:
    provider:
      type: anthropic
      model: claude-sonnet-4-6
    subcall_provider:
      type: anthropic
      model: claude-haiku-4-5-20251001
    budget:
      max_cost: 5.0
      max_iterations: 50
      max_time_seconds: 300

  # Hybrid: Cloud root model + local subcalls (cost-effective)
  hybrid:
    provider:
      type: anthropic
      model: claude-sonnet-4-6
    subcall_provider:
      type: openai
      model: qwen3:latest
      base_url: http://localhost:11434/v1
    budget:
      max_cost: 2.50
      max_iterations: 50
      max_time_seconds: 300

  # Research: High limits for deep analysis
  research:
    extends: cloud
    provider:
      type: anthropic
      model: claude-opus-4-6
    budget:
      max_cost: 10.0
      max_iterations: 100
      max_time_seconds: 600

  # Creative: Higher temperature for varied outputs
  creative:
    provider:
      type: anthropic
      model: claude-sonnet-4-6
    inference:
      temperature: 1.0
      top_p: 0.95
    budget:
      max_cost: 5.0

  # Deterministic: Low temperature for consistent results
  deterministic:
    provider:
      type: openai
      model: gpt-4o
    inference:
      temperature: 0.0
      seed: 42
    budget:
      max_cost: 5.0
