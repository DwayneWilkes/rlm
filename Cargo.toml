[package]
name = "rlm"
version = "0.1.0"
edition = "2021"
description = "Read-Loop-Mond — iterative LLM + code execution engine"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "3", default-features = false, features = ["json"] }
sha2 = "0.10"
anyhow = "1"
colored = "2"

[dev-dependencies]
tempfile = "3"
